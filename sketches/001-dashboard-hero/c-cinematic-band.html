<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>C: Cinematic band</title><link rel="stylesheet" href="shared.css">
<style>
/* C: a full-bleed atmospheric band: slow aurora of the brand mint, a huge light greeting, and the deals
   as glowing "orbit" pills you can click, sitting on the band's lower edge. Most mood, least density. */
.band { position: relative; margin: 0 -48px; padding: 80px 48px 44px; overflow: hidden; border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, #0b0f0e 0%, var(--bg) 100%); }
.aurora { position: absolute; inset: -30% -10% 0 -10%; pointer-events: none; filter: blur(48px); opacity: .55; }
.aurora i { position: absolute; border-radius: 50%; }
.aurora i:nth-child(1) { width: 52%; height: 70%; left: 4%; top: 10%; background: color-mix(in srgb, var(--accent) 45%, transparent); animation: a1 18s ease-in-out infinite alternate; }
.aurora i:nth-child(2) { width: 38%; height: 55%; left: 46%; top: 0; background: color-mix(in srgb, #3b82f6 28%, transparent); animation: a2 22s ease-in-out infinite alternate; }
.aurora i:nth-child(3) { width: 30%; height: 45%; left: 70%; top: 35%; background: color-mix(in srgb, var(--pink) 18%, transparent); animation: a1 26s ease-in-out infinite alternate-reverse; }
@keyframes a1 { to { transform: translate(8%, 10%) scale(1.15); } } @keyframes a2 { to { transform: translate(-10%, 8%) scale(.9); } }
.noise { position: absolute; inset: 0; opacity: .08; pointer-events: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
.wrap.b { position: relative; }
.date { font-size: 13px; color: var(--ink-dim); margin: 0 0 18px; letter-spacing: .02em; }
.hello { font: 300 80px/.95 var(--heading); letter-spacing: -.045em; color: var(--ink-strong); margin: 0; }
.hello em { font-style: normal; font-weight: 700; background: linear-gradient(90deg, var(--ink-strong), var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.lede { font-size: 18px; color: var(--ink-dim); margin: 22px 0 0; max-width: 46ch; }
.chips { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 34px; }
.chip { display: inline-flex; align-items: center; gap: 10px; padding: 9px 14px 9px 9px; border-radius: 999px; border: 1px solid var(--line-2);
  background: color-mix(in srgb, var(--panel) 70%, transparent); backdrop-filter: blur(8px); font-size: 13.5px; color: var(--ink); }
.chip .m { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font: 700 11px var(--heading); color: #111; }
.chip b { color: var(--ink-strong); font-weight: 600; }
.chip.hot { border-color: color-mix(in srgb, var(--accent) 60%, transparent); box-shadow: 0 0 24px -6px color-mix(in srgb, var(--accent) 60%, transparent); }
.stats { display: flex; gap: 34px; margin-top: 30px; padding-top: 22px; border-top: 1px solid color-mix(in srgb, var(--line-2) 60%, transparent); }
.stats span { display: block; font-size: 12px; color: var(--ink-faint); } .stats strong { font: 600 20px var(--heading); color: var(--ink-strong); }
</style></head>
<body><div class="layout"><aside class="sidebar"></aside>
<main class="main">
  <section class="band"><div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div><div class="noise" aria-hidden="true"></div>
    <div class="wrap b">
      <p class="date in d1">Monday, October 26</p>
      <h1 class="hello in d2">Good evening,<br><em>Amr</em>.</h1>
      <p class="lede in d3">Spotify needs you before anything else today.</p>
      <div class="chips in d4">
        <span class="chip hot"><span class="m" style="background:#1ed760">S</span><b>Spotify</b> Review 3 suggestions</span>
        <span class="chip"><span class="m" style="background:#1434cb;color:#fff">V</span><b>Visa</b> Find the VP of Engineering</span>
        <span class="chip"><span class="m" style="background:#a3aaae">A</span><b>Apple</b> Fill 22 inputs</span>
      </div>
      <div class="stats in d4"><div><span>Pipeline</span><strong>$1.4M to $8.3M</strong></div><div><span>Confirmed</span><strong>11%</strong></div><div><span>New</span><strong>4</strong></div></div>
    </div>
  </section>
  <div class="wrap"><div data-rows></div></div>
</main></div>
<span class="tag">C: Cinematic band</span><button class="replay">Replay motion</button>
<script src="shared.js"></script></body></html>
